# video-studio: сценарий → озвучка → визуал → рендер Remotion → MP4 прямо в GitHub Actions.
#
# Как пользоваться (подробно — video-studio/README.md, раздел «GitHub Actions»):
#   1. mode = draft, topic = «тема» → сценарий scripts/<имя>.json коммитится в эту ветку.
#      Проверьте и поправьте его на github.com (карандаш ✏️ в файле).
#   2. mode = render, script = video-studio/scripts/<имя>.json → готовое видео в артефакте,
#      по желанию — в релизе GitHub, на YouTube (сразу или в слот 12:00/19:00 МСК) и в Instagram.
#   3. mode = batch, script = video-studio/scripts/sut-01*.json (маска или список через запятую) →
#      ролики по очереди, на YouTube — каждый в свой слот подряд (schedule = slots), в Instagram —
#      в очередь: её публикует workflow «video-studio: Instagram по расписанию».
#   4. plan = 08a,08b — темы из content/plan.json (хук, угол, факты с источниками): mode = draft
#      пишет по ним сценарии scripts/sut-08a-….json; mode = batch пишет недостающие и собирает все
#      (upload = release: в релизе файл 08a-….mp4 — его грузят в Studio руками, тексты для
#      youtube-fill попадают в content/videos.json). Так запускает и веб-панель (video-studio/panel).
#   5. lang = en (kk, uz) — тот же ролик на другом языке: draft переводит сценарий темы в
#      scripts/<язык>/, render/batch собирают его с каналом channels/<язык>.json (файл в релизе —
#      en-08a-….mp4). Загрузка в YouTube/Instagram для других языков выключена (свой канал — свой ключ).
#   6. plan = L01 — «Разбор» (16:9, ~7 минут) на тему из content/long-plan.json: draft пишет
#      scripts/razbor-L01-….json, batch собирает его горизонтальным (формат — из сценария) в релиз
#      L01-….mp4 + thumbnail.png 16:9, тексты — в content/videos.json. Один «Разбор» ≈ 3 запроса
#      Gemini TTS из ~10 в сутки и 40–60 минут раннера; Telegram и Instagram их не берут.
# Кнопка «Run workflow» появляется, только когда этот файл лежит в ветке по умолчанию.

name: "video-studio: ролик"
# Коды роликов в названии запуска — по ним веб-панель видит, что сейчас пишется или собирается.
run-name: "${{ github.event_name == 'schedule' && 'draft: по расписанию' || format('{0}: {1}{2}', inputs.mode || 'draft', inputs.plan || inputs.topic || inputs.script || 'демо', inputs.lang && inputs.lang != 'ru' && format(' [{0}]', inputs.lang) || '') }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "draft — только сценарий на проверку; render — собрать видео; batch — несколько сценариев подряд"
        type: choice
        options: [draft, render, batch]
        default: draft
      topic:
        description: "Тема ролика (draft; для render без script — полный автомат)"
        type: string
        required: false
      script:
        description: "render: путь к сценарию (пусто и нет темы — демо); batch: список через запятую или маска video-studio/scripts/sut-01*.json"
        type: string
        required: false
      plan:
        description: "Коды тем через запятую: 08a,08b — Shorts из content/plan.json, L01 — «Разбор» из content/long-plan.json. draft — сценарии по плану; batch — недостающие сценарии, затем сборка всех"
        type: string
        required: false
      format:
        description: "auto — из сценария (для темы — shorts); landscape — ещё и лимит времени 2 ч"
        type: choice
        options: [auto, shorts, landscape]
        default: auto
      voice:
        description: "Озвучка: auto — Gemini, если есть секрет GEMINI_API_KEY, иначе Edge (при сбое — Edge/Piper)"
        type: choice
        options: [auto, gemini, edge, piper, elevenlabs]
        default: auto
      voice_name:
        description: "Голос (необязательно): Charon, Puck, Kore… (gemini) · ru-RU-SvetlanaNeural (edge) · ru_RU-irina-medium (piper)"
        type: string
        required: false
      voice_fallback:
        description: "Основной голос не работает (кончилась квота Gemini): auto — озвучить запасным (Edge/Piper, пометка в qc.json); none — не подменять: ролик падает и соберётся при повторе (так запускает автопилот панели)"
        type: choice
        options: [auto, none]
        default: auto
      theme:
        description: "Палитра"
        type: choice
        options: [auto, midnight, sunset, emerald, mono]
        default: auto
      music:
        description: "Музыка: auto — как обычно (переменная MUSIC, иначе трек из music/ или эмбиент); none — без музыки"
        type: choice
        options: [auto, none]
        default: auto
      upload:
        description: "Куда отдать результат. instagram: render — публикует сразу, batch — ставит в очередь (релиз)"
        type: choice
        options: [none, release, youtube, instagram, youtube+instagram, release+youtube, release+youtube+instagram]
        default: none
      privacy:
        description: "Видимость на YouTube (при schedule = slots — приватно до времени публикации)"
        type: choice
        options: [private, unlisted, public]
        default: private
      schedule:
        description: "YouTube по расписанию: slots — слоты 12:00/19:00 МСК из channel.json (render — ближайший свободный, batch — по одному подряд)"
        type: choice
        options: [none, slots]
        default: none
      schedule_start:
        description: "Необязательно: считать слоты от даты, например 2026-10-14 (иначе — от момента запуска)"
        type: string
        required: false
      lang:
        description: "Язык ролика: ru — «Суть за минуту»; en/kk/uz — перевод (scripts/<язык>/, channels/<язык>.json), только upload = none или release"
        type: choice
        options: [ru, en, kk, uz]
        default: ru
  # Запуск по расписанию (раскомментируйте): черновик на тему из переменной
  # репозитория SCHEDULED_TOPIC, например по понедельникам и четвергам в 05:17 UTC.
  # schedule:
  #   - cron: "17 5 * * 1,4"

permissions:
  contents: write # коммит черновика и релизы

# Один запуск за раз: не делим квоты бесплатных API и не толкаемся при пуше черновиков.
# queue: max — ждать могут до 100 запусков; по умолчанию (single) ждёт только один,
# а третий запуск молча отменял бы второй.
concurrency:
  group: video-studio
  cancel-in-progress: false
  queue: max

jobs:
  video:
    name: ${{ inputs.mode == 'batch' && 'Пакет роликов' || ((inputs.mode || 'draft') == 'render' && 'Рендер ролика' || 'Черновик сценария') }}
    # Явная версия: ubuntu-latest переезжает на 26.04 с 2026-10-19.
    runs-on: ubuntu-24.04
    # Сборке — всегда 2 ч: черновик landscape рендерится с format = auto (формат берётся из
    # сценария), и 40 минут на ~8-минутный ролик не хватает. Лимит ничего не стоит, пока не достигнут.
    # Пакет: ~8 минут на Shorts, максимум раннера — 6 ч (≈ 40 роликов).
    timeout-minutes: ${{ inputs.mode == 'batch' && 350 || ((inputs.mode || 'draft') == 'render' && 120 || 40) }}
    defaults:
      run:
        working-directory: video-studio
        shell: bash
    env:
      MODE: ${{ inputs.mode || 'draft' }}
      # SCHEDULED_TOPIC — только для расписания: ручной запуск без темы — это демо (render)
      # или понятная ошибка (draft), а не чужая тема.
      TOPIC: ${{ github.event_name == 'schedule' && vars.SCHEDULED_TOPIC || inputs.topic }}
      SCRIPT_PATH: ${{ inputs.script }}
      PLAN: ${{ inputs.plan }}
      FORMAT: ${{ inputs.format || 'auto' }}
      THEME: ${{ inputs.theme || 'auto' }}
      UPLOAD: ${{ inputs.upload || 'none' }}
      PRIVACY: ${{ inputs.privacy || 'private' }}
      SCHEDULE: ${{ inputs.schedule || 'none' }}
      SCHEDULE_START: ${{ inputs.schedule_start }}
      VIDEO_LANG: ${{ inputs.lang || 'ru' }}
      # Несекретные настройки — Settings → Secrets and variables → Actions → Variables.
      TTS_PROVIDER: ${{ inputs.voice || vars.TTS_PROVIDER || 'auto' }}
      TTS_VOICE: ${{ inputs.voice_name || vars.TTS_VOICE }}
      TTS_RATE: ${{ vars.TTS_RATE }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      VISUALS: ${{ vars.VISUALS }}
      # Кнопка «Пересобрать» в панели может выключить музыку (music = none) для одного запуска.
      MUSIC: ${{ inputs.music == 'none' && 'none' || vars.MUSIC }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      # Остальные несекретные настройки из .env.example; пустое значение = умолчание.
      # voice_fallback = none (автопилот панели): без молчаливой подмены голоса на Edge.
      TTS_FALLBACK: ${{ inputs.voice_fallback == 'none' && 'none' || vars.TTS_FALLBACK }}
      # Общий кэш озвучки: раннер чистый, кэш живёт между запусками через actions/cache (шаги ниже).
      TTS_CACHE_DIR: ${{ github.workspace }}/video-studio/.cache/voice
      # Пересборка берёт тот же текст из кэша — тот же дубль. Нужен новый (оговорка, обрезанное
      # слово): переменная TTS_CACHE = 0 на время пересборки или правка текста сцены.
      TTS_CACHE: ${{ vars.TTS_CACHE }}
      TTS_CACHE_DAYS: ${{ vars.TTS_CACHE_DAYS }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ inputs.voice_name || vars.GEMINI_TTS_VOICE }}
      GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
      LLM_FALLBACKS: ${{ vars.LLM_FALLBACKS }}
      LLM_EFFORT: ${{ vars.LLM_EFFORT }}
      VISUALS_PREFER: ${{ vars.VISUALS_PREFER }}
      # Судья Claude для кадров (платно, по умолчанию выключен): VISUALS_JUDGE=claude + секрет ANTHROPIC_API_KEY.
      VISUALS_JUDGE: ${{ vars.VISUALS_JUDGE }}
      VISUALS_JUDGE_MODEL: ${{ vars.VISUALS_JUDGE_MODEL }}
      VISUALS_MIN_PHOTO_PX: ${{ vars.VISUALS_MIN_PHOTO_PX }}
      MUSIC_MOOD: ${{ vars.MUSIC_MOOD }}
      LOUDNESS_TARGET: ${{ vars.LOUDNESS_TARGET }}
      YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID }}
      YT_SYNTHETIC_MEDIA: ${{ vars.YT_SYNTHETIC_MEDIA }}
      # Расписание и Instagram (умолчания — в channel.json и .env.example).
      PUBLISH_TIMES: ${{ vars.PUBLISH_TIMES }}
      PUBLISH_TZ: ${{ vars.PUBLISH_TZ }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION }}
      IG_AI_GENERATED: ${{ vars.IG_AI_GENERATED }}
      MODELS_DIR: ${{ github.workspace }}/video-studio/models
      # На 2 vCPU (приватный репозиторий) 2 потока быстрее авто-значения (1) на ~12 %.
      RENDER_CONCURRENCY: ${{ vars.RENDER_CONCURRENCY || '2' }}
      NO_COLOR: "1"
    steps:
      - name: Код репозитория
        uses: actions/checkout@v7
        with:
          # Черновику и пакету по плану — свежий конец ветки, а не коммит момента запуска:
          # иначе повторный/ждавший в очереди запуск не видит уже запушенные черновики,
          # даёт файлу то же имя и ловит конфликт при пуше.
          ref: ${{ (env.MODE == 'draft' || env.PLAN != '') && github.ref_name || '' }}
          # Токен с правом записи не оставляем в .git/config: его увидел бы любой
          # код зависимостей npm. Пушу черновика токен дают явно (см. ниже).
          persist-credentials: false

      # Ключи YouTube и Instagram здесь — от русского канала: ролик на другом языке туда не грузим.
      - name: Язык ролика
        if: env.VIDEO_LANG != 'ru' && (contains(env.UPLOAD, 'youtube') || contains(env.UPLOAD, 'instagram'))
        run: |
          echo "::error::Ролик на «$VIDEO_LANG» нельзя загрузить в YouTube/Instagram отсюда: ключи — от русского канала. Выберите upload = release или none и загрузите файл в Studio своего канала руками (video-studio/README.md, «Ролики на других языках»)."
          exit 1

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-studio/package-lock.json

      - name: Зависимости (npm ci)
        run: npm ci --no-audit --no-fund

      # После npm ci: он удаляет node_modules целиком.
      - name: Кэш браузера Remotion и webpack
        if: env.MODE != 'draft'
        uses: actions/cache@v6
        with:
          path: |
            video-studio/node_modules/.remotion
            video-studio/node_modules/.cache/webpack
          key: remotion-${{ runner.os }}-${{ hashFiles('video-studio/package-lock.json') }}-${{ hashFiles('video-studio/src/remotion/**', 'video-studio/src/types.ts') }}
          restore-keys: |
            remotion-${{ runner.os }}-${{ hashFiles('video-studio/package-lock.json') }}-

      # Голоса Piper и модель распознавания речи для таймингов субтитров (GigaAM v2, ~240 МБ,
      # voice/align.ts). v2: в записях v1 модели распознавания нет, а при точном попадании
      # actions/cache кэш не перезаписывает — модель качалась бы каждый запуск. Голос Piper
      # из v1 подхватывается через restore-keys, новая запись сохраняется уже с обеими моделями.
      - name: Кэш локальных моделей (Piper, распознавание речи)
        if: env.MODE != 'draft'
        uses: actions/cache@v6
        with:
          path: video-studio/models
          key: tts-models-${{ runner.os }}-${{ inputs.voice_name || vars.TTS_VOICE || 'default' }}-v2
          restore-keys: |
            tts-models-${{ runner.os }}-${{ inputs.voice_name || vars.TTS_VOICE || 'default' }}-

      # Озвученные сцены прошлых запусков (ключ записи — хэш провайдера, голоса, стиля и текста):
      # пересборка и повтор упавшего запуска не тратят суточную квоту Gemini заново.
      # Берётся самый свежий кэш; сохраняется отдельным шагом в конце — даже если запуск упал.
      - name: Кэш озвучки — восстановить
        id: voice-cache
        if: env.MODE != 'draft'
        uses: actions/cache/restore@v6
        with:
          path: video-studio/.cache/voice
          key: tts-voice-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tts-voice-${{ runner.os }}-

      - name: Системные библиотеки для Chrome Headless Shell
        if: env.MODE != 'draft'
        # Список — из документации Remotion (Linux Dependencies, Ubuntu 24.04), с t64-именами пакетов Noble.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 \
            libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libcairo2 \
            libpango-1.0-0 libatk-bridge2.0-0t64

      - name: Браузер для рендера
        if: env.MODE != 'draft'
        run: npx remotion browser ensure

      # ---------- draft: сценарий на проверку ----------
      - name: Черновик сценария
        id: draft
        if: env.MODE == 'draft' || (env.MODE == 'batch' && env.PLAN != '')
        # Пакет по плану: тема, на которой LLM споткнулся, не мешает собрать остальные.
        continue-on-error: ${{ env.MODE == 'batch' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          lang=()
          if [ "$VIDEO_LANG" != "ru" ]; then lang=(--lang "$VIDEO_LANG"); fi
          if [ -n "$PLAN" ]; then
            # Темы плана: сценарии scripts/sut-<код>-….json, отметка в plan.json; готовые пропускаются.
            # Коды L01… — «Разборы» из content/long-plan.json → scripts/razbor-L01-….json.
            # Другой язык — перевод русского сценария темы в scripts/<язык>/ (план не меняется).
            npm run script -- --plan "$PLAN" "${lang[@]}"
          elif [ -n "$TOPIC" ]; then
            fmt="$FORMAT"; [ "$fmt" = "auto" ] && fmt=shorts
            npm run script -- --topic "$TOPIC" --format "$fmt" "${lang[@]}"
          else
            echo "::error::Для mode=draft нужна тема (поле topic) или коды тем из плана (поле plan, например 08a,08b)."
            exit 1
          fi

      - name: Черновик в артефакте (на случай, если пуш не прошёл)
        if: always() && (steps.draft.outputs.script_path != '' || steps.draft.outputs.script_paths != '')
        uses: actions/upload-artifact@v7
        with:
          name: script-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            video-studio/${{ steps.draft.outputs.script_path || 'scripts/sut-*.json' }}
            video-studio/scripts/razbor-L*.json
            video-studio/scripts/*/sut-*.json
            video-studio/content/plan.json
            video-studio/content/long-plan.json
          retention-days: 7

      # ---------- render: видео ----------
      - name: Сборка ролика
        id: render
        if: env.MODE == 'render'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          args=()
          if [ -n "$SCRIPT_PATH" ]; then
            args+=(--script "$SCRIPT_PATH")
          elif [ -n "$TOPIC" ]; then
            args+=(--topic "$TOPIC")
          else
            echo "::notice::Не задан ни script, ни topic — собираю демо-ролик."
            args+=(--demo)
          fi
          [ "$FORMAT" != "auto" ] && args+=(--format "$FORMAT")
          [ "$THEME" != "auto" ] && args+=(--theme "$THEME")
          [ "$VIDEO_LANG" != "ru" ] && args+=(--lang "$VIDEO_LANG")
          npm run make -- "${args[@]}"

      # continue-on-error: когда квота хранилища артефактов исчерпана, загрузка падает —
      # но релиз и YouTube всё равно должны получить готовое видео, иначе оно пропадёт
      # вместе с раннером.
      - name: Артефакт
        id: artifact
        if: env.MODE == 'render' && steps.render.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: video-${{ steps.render.outputs.slug }}-${{ github.run_number }}-${{ github.run_attempt }}
          # Бесплатный план: 500 МБ хранилища, и считаются ГБ·часы за месяц — храним
          # недолго и без props/public; если ролик уходит в релиз, артефакт — на сутки.
          retention-days: ${{ contains(env.UPLOAD, 'release') && 1 || 7 }}
          compression-level: 0
          if-no-files-found: error
          path: |
            video-studio/${{ steps.render.outputs.run_dir }}/video.mp4
            video-studio/${{ steps.render.outputs.run_dir }}/thumbnail.png
            video-studio/${{ steps.render.outputs.run_dir }}/captions.srt
            video-studio/${{ steps.render.outputs.run_dir }}/description.txt
            video-studio/${{ steps.render.outputs.run_dir }}/instagram.txt
            video-studio/${{ steps.render.outputs.run_dir }}/cover.jpg
            video-studio/${{ steps.render.outputs.run_dir }}/cost.json
            video-studio/${{ steps.render.outputs.run_dir }}/script.json

      - name: Ссылка на артефакт
        if: steps.artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          DAYS: ${{ contains(env.UPLOAD, 'release') && 1 || 7 }}
        run: |
          echo "📦 **Скачать:** [видео, обложка, субтитры, описание]($ARTIFACT_URL) — хранится дней: $DAYS." >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт не сохранился
        if: steps.artifact.outcome == 'failure'
        run: |
          echo "::warning::Артефакт не сохранился — чаще всего исчерпана квота хранилища артефактов (бесплатный план, сбрасывается только с новым расчётным периодом). Чтобы ролик не пропал, запускайте с upload = release."
          echo "⚠️ **Артефакт не сохранился** (вероятно, кончилась квота хранилища артефактов). Выберите upload = release — релизы в эту квоту не входят." >> "$GITHUB_STEP_SUMMARY"

      - name: Релиз GitHub
        id: release
        if: env.MODE == 'render' && contains(env.UPLOAD, 'release') && steps.render.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.render.outputs.run_dir }}
          SLUG: ${{ steps.render.outputs.slug }}
          TITLE: ${{ steps.render.outputs.title }}
          DURATION: ${{ steps.render.outputs.duration_sec }}
        run: |
          # Сценарий из плана (scripts/sut-08a-….json) → файл 08a-….mp4: под этим именем ролик
          # грузят в Studio руками, по коду его находит youtube-fill (тексты — content/videos.json).
          code=""
          if [[ "$(basename "$SCRIPT_PATH")" =~ ^sut-([0-9]{2}[a-z])- ]]; then code="${BASH_REMATCH[1]}"; fi
          # «Разбор» по длинному плану: scripts/razbor-L01-….json → L01-….mp4.
          if [[ "$(basename "$SCRIPT_PATH")" =~ ^razbor-([lL][0-9]{2})- ]]; then code="L${BASH_REMATCH[1]:1}"; fi
          # Другой язык — «en-08a-….mp4»: «08a-….mp4» панель и youtube-fill считают роликом русского канала.
          lp=""
          if [ "$VIDEO_LANG" != "ru" ]; then lp="$VIDEO_LANG-"; fi
          mp4="$RUN_DIR/video.mp4"
          if [ -n "$code" ]; then mp4="$RUN_DIR/$lp$code-${SLUG:0:60}.mp4"; cp "$RUN_DIR/video.mp4" "$mp4"; fi
          # run_attempt: при «Re-run» номер запуска тот же, и тег уже занят.
          tag="video-$lp${code:+$code-}${SLUG:0:60}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          files=("$mp4" "$RUN_DIR/captions.srt" "$RUN_DIR/description.txt")
          # instagram.txt и cover.jpg — для ручной публикации Reels с телефона; thumbnail.jpg — копия
          # обложки до 2 МБ (её ставит «Разбору» панель, если PNG для YouTube великоват).
          for f in thumbnail.png thumbnail.jpg cover.jpg instagram.txt qc.json; do
            [ -f "$RUN_DIR/$f" ] && files+=("$RUN_DIR/$f")
          done
          gh release create "$tag" "${files[@]}" --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUN_DIR/description.txt"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          url=$(gh release view "$tag" --json url -q .url)
          echo "🏷️ **Релиз:** [$tag]($url) — файлы хранятся, пока вы не удалите релиз." >> "$GITHUB_STEP_SUMMARY"
          # Тексты для youtube-fill — только у роликов русского канала.
          if [ -n "$code" ] && [ -n "$DURATION" ] && [ "$VIDEO_LANG" = "ru" ]; then
            env -u GH_TOKEN npx tsx src/cli/videos-list.ts "$RUN_DIR" --code "$code" --file "$(basename "$mp4" .mp4)" --duration "$DURATION"
          fi

      # Раннер каждый раз чистый: какие слоты уже заняты прошлыми запусками, узнаём из
      # youtube-result.json в релизах. Без npm-кода — токен GitHub ему не достаётся.
      - name: Занятые слоты YouTube (из релизов)
        id: slots
        if: env.SCHEDULE == 'slots' && contains(env.UPLOAD, 'youtube') && (env.MODE == 'batch' || steps.render.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select([.assets[].name] | index("youtube-result.json")) | .tag_name' > "$RUNNER_TEMP/yt-tags"
          mapfile -t tags < <(head -n 40 "$RUNNER_TEMP/yt-tags")
          for t in "${tags[@]}"; do
            d="out/_slot-${t:0:80}"
            mkdir -p "$d"
            gh release download "$t" --pattern youtube-result.json --dir "$d" --clobber || true
          done
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          last=""
          if compgen -G "out/_slot-*/youtube-result.json" > /dev/null; then
            last=$(jq -r --arg now "$now" 'select(.publishAt != null and .publishAt > $now) | .publishAt' out/_slot-*/youtube-result.json | LC_ALL=C sort | tail -n 1)
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          [ -n "$last" ] && echo "Последний запланированный ролик: $last"
          echo "Занятых слотов найдено: ${#tags[@]} релизов просмотрено"

      - name: Загрузка на YouTube
        id: youtube
        if: env.MODE == 'render' && contains(env.UPLOAD, 'youtube') && steps.render.outcome == 'success'
        env:
          RUN_DIR: ${{ steps.render.outputs.run_dir }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          args=("$RUN_DIR" --privacy "$PRIVACY")
          if [ "$SCHEDULE" = "slots" ]; then
            args+=(--schedule)
            [ -n "$SCHEDULE_START" ] && args+=(--schedule-start "$SCHEDULE_START")
          fi
          npm run upload -- "${args[@]}"

      - name: Время публикации — в релиз
        if: steps.youtube.outcome == 'success' && steps.release.outputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.render.outputs.run_dir }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" "$RUN_DIR/youtube-result.json" --clobber

      # Instagram публикует сразу: у API нет отложенной публикации (по расписанию —
      # mode = batch + workflow «video-studio: Instagram по расписанию»).
      - name: Публикация в Instagram
        id: instagram
        if: env.MODE == 'render' && contains(env.UPLOAD, 'instagram') && steps.render.outcome == 'success'
        env:
          RUN_DIR: ${{ steps.render.outputs.run_dir }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npx tsx src/cli/upload.ts "$RUN_DIR" --to instagram

      # Отдельным шагом: токен записи не попадает в процесс с npm-зависимостями.
      - name: Отметить релиз как опубликованный в Instagram
        if: steps.instagram.outcome == 'success' && steps.release.outputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.render.outputs.run_dir }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cp "$RUN_DIR/instagram-result.json" "$RUN_DIR/instagram-published.json"
          gh release upload "$TAG" "$RUN_DIR/instagram-published.json" --clobber

      # ---------- batch: несколько сценариев подряд ----------
      - name: Пакет роликов
        id: batch
        if: env.MODE == 'batch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Токен записи — только для gh release; процессу make (npm-зависимости) он не передаётся.
          GH_TOKEN: ${{ github.token }}
          LAST_TAKEN: ${{ steps.slots.outputs.last }}
        run: |
          # Список сценариев: через запятую, маски можно; пути — от корня репозитория или от video-studio.
          # Или коды тем плана (plan): их сценарии scripts/sut-<код>-*.json написал шаг черновика.
          files=()
          failed=()
          missing=()
          if [ -n "$PLAN" ] && [ -z "$SCRIPT_PATH" ]; then
            IFS=', ' read -r -a codes <<< "$PLAN"
            sdir="scripts"
            if [ "$VIDEO_LANG" != "ru" ]; then sdir="scripts/$VIDEO_LANG"; fi
            for c in "${codes[@]}"; do
              c="${c,,}"
              [ -z "$c" ] && continue
              # «Разбор» по длинному плану: L01 → scripts/razbor-L01-*.json (формат 16:9 — из сценария).
              pfx="sut-"
              if [[ "$c" =~ ^l[0-9]{2}$ ]]; then c="L${c:1}"; pfx="razbor-"; fi
              f=$(compgen -G "$sdir/$pfx$c-*.json" | LC_ALL=C sort | head -n 1 || true)
              if [ -n "$f" ]; then
                files+=("$f")
              else
                echo "::error::$c: сценария нет — он не написался (причина — в шаге «Черновик сценария»)."
                missing+=("$c")
                failed+=("$c (нет сценария)")
              fi
            done
          else
            IFS=',' read -r -a pats <<< "$SCRIPT_PATH"
            for pat in "${pats[@]}"; do
              pat="${pat#"${pat%%[![:space:]]*}"}"
              pat="${pat%"${pat##*[![:space:]]}"}"
              [ -z "$pat" ] && continue
              pat="${pat#./}"
              pat="${pat#video-studio/}"
              found=0
              while IFS= read -r f; do
                files+=("$f")
                found=1
              done < <(compgen -G "$pat" | LC_ALL=C sort)
              if [ "$found" = 0 ]; then
                echo "::error::Сценарий не найден: $pat (путь от корня репозитория, например video-studio/scripts/sut-01*.json)"
                exit 1
              fi
            done
          fi
          n=${#files[@]}
          if [ "$n" = 0 ]; then
            echo "::error::Для mode=batch укажите сценарии в поле script (список через запятую или маску video-studio/scripts/sut-01*.json) или коды тем в поле plan."
            exit 1
          fi
          # Квота Gemini TTS: Shorts — 1 запрос, «Разбор» (razbor-*) — ≈ 3 (~7000 символов по 2500).
          tts=0
          for f in "${files[@]}"; do
            if [[ "$(basename "$f")" == razbor-* ]]; then tts=$((tts + 3)); else tts=$((tts + 1)); fi
          done
          if [ "$tts" -gt 10 ]; then
            if [ "$TTS_FALLBACK" = "none" ]; then
              echo "::warning::$n роликов за раз (≈ $tts запросов озвучки): бесплатной квоты Gemini TTS (~10 запросов в сутки) не хватит — остальные упадут (voice_fallback = none) и соберутся при повторе. Надёжнее по 8–10 Shorts (или 1 «Разбор» + 5–7 Shorts) за запуск."
            else
              echo "::warning::$n роликов за раз (≈ $tts запросов озвучки): бесплатной квоты Gemini TTS (~10 запросов в сутки) не хватит — остальные озвучит Edge. Надёжнее по 8–10 Shorts (или 1 «Разбор» + 5–7 Shorts) за запуск."
            fi
          fi
          # Точка отсчёта слотов фиксируется один раз: пока идёт пакет, номера слотов не сдвигаются.
          # Без schedule_start — сразу после последнего уже запланированного ролика (или от «сейчас»).
          start="${SCHEDULE_START:-${LAST_TAKEN:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}}"
          [ "$SCHEDULE" = "slots" ] && echo "Слоты считаются от: $start"
          release=""
          if [[ "$UPLOAD" == *release* || "$UPLOAD" == *instagram* ]]; then release=1; fi
          {
            echo "## 📦 Пакет: $n роликов"
            echo ""
            echo "| № | Сценарий | Результат |"
            echo "|---|---|---|"
            for c in "${missing[@]}"; do echo "| — | $c | ❌ сценарий не написался |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          for i in "${!files[@]}"; do
            f="${files[$i]}"
            slot=$((i + 1))
            args=(--script "$f")
            [ "$FORMAT" != "auto" ] && args+=(--format "$FORMAT")
            [ "$THEME" != "auto" ] && args+=(--theme "$THEME")
            [ "$VIDEO_LANG" != "ru" ] && args+=(--lang "$VIDEO_LANG")
            if [[ "$UPLOAD" == *youtube* ]]; then
              args+=(--upload youtube --privacy "$PRIVACY")
              [ "$SCHEDULE" = "slots" ] && args+=(--schedule-slot "$slot" --schedule-start "$start")
            fi
            out="$RUNNER_TEMP/make-$slot.out"
            : > "$out"
            echo "::group::[$slot/$n] $f"
            # Свой GITHUB_OUTPUT на ролик: отсюда берём папку, slug и заголовок; сводку make пишет сам.
            if env -u GH_TOKEN GITHUB_OUTPUT="$out" npm run make -- "${args[@]}"; then
              status="✅"
            else
              status="❌"
              failed+=("$f")
            fi
            echo "::endgroup::"
            run_dir=$(sed -n 's/^run_dir=//p' "$out" | tail -n 1)
            slug=$(sed -n 's/^slug=//p' "$out" | tail -n 1)
            title=$(sed -n 's/^title=//p' "$out" | tail -n 1)
            yt=$(sed -n 's/^youtube_url=//p' "$out" | tail -n 1)
            at=$(sed -n 's/^youtube_publish_at=//p' "$out" | tail -n 1)
            dur=$(sed -n 's/^duration_sec=//p' "$out" | tail -n 1)
            # Озвучка: не удалась (квота) или ролик озвучен запасным голосом — видно прямо в таблице.
            verr=$(sed -n 's/^voice_error=//p' "$out" | tail -n 1)
            vname=$(sed -n 's/^voice=//p' "$out" | tail -n 1)
            vfb=$(sed -n 's/^voice_fallback=//p' "$out" | tail -n 1)
            code=""
            if [[ "$(basename "$f")" =~ ^sut-([0-9]{2}[a-z])- ]]; then code="${BASH_REMATCH[1]}"; fi
            if [[ "$(basename "$f")" =~ ^razbor-([lL][0-9]{2})- ]]; then code="L${BASH_REMATCH[1]:1}"; fi
            note="$status${verr:+ $verr}${yt:+ $yt}${at:+, выйдет $at}"
            [ -n "$vfb" ] && note="$note, голос: $vname"
            if [ -n "$release" ] && [ -n "$run_dir" ] && [ -f "$run_dir/video.mp4" ]; then
              # Файл с кодом (08a-….mp4): под этим именем ролик грузят в Studio руками,
              # по коду его находит youtube-fill.
              lp=""
              if [ "$VIDEO_LANG" != "ru" ]; then lp="$VIDEO_LANG-"; fi
              mp4="$run_dir/video.mp4"
              if [ -n "$code" ]; then mp4="$run_dir/$lp$code-${slug:0:60}.mp4"; cp "$run_dir/video.mp4" "$mp4"; fi
              tag="video-$lp${code:+$code-}${slug:0:50}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${slot}"
              rfiles=("$mp4" "$run_dir/captions.srt" "$run_dir/description.txt")
              for x in thumbnail.png thumbnail.jpg cover.jpg instagram.txt youtube-result.json qc.json; do
                [ -f "$run_dir/$x" ] && rfiles+=("$run_dir/$x")
              done
              # instagram.json в релизе = ролик в очереди Instagram (её разбирает отдельный workflow).
              [[ "$UPLOAD" == *instagram* ]] && [ -f "$run_dir/instagram.json" ] && rfiles+=("$run_dir/instagram.json")
              if gh release create "$tag" "${rfiles[@]}" --prerelease --target "$GITHUB_SHA" --title "${title:-$slug}" --notes-file "$run_dir/description.txt"; then
                note="$note, релиз \`$tag\`"
                # Тексты для youtube-fill — в content/videos.json (его коммитит шаг ниже).
                if [ -n "$code" ] && [ -n "$dur" ] && [ "$status" = "✅" ] && [ "$VIDEO_LANG" = "ru" ]; then
                  env -u GH_TOKEN npx tsx src/cli/videos-list.ts "$run_dir" --code "$code" --file "$(basename "$mp4" .mp4)" --duration "$dur" || failed+=("$f (тексты для YouTube)")
                fi
              else
                note="$note, ⚠ релиз не создан"
                failed+=("$f (релиз)")
              fi
            fi
            echo "| $slot | \`$f\` | $note |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$UPLOAD" == *instagram* ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📸 Ролики стоят в очереди Instagram: их по одному публикует workflow «video-studio: Instagram по расписанию» (включите в нём расписание или запускайте вручную)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Не удалось: %s\n' "${failed[@]}"
            exit 1
          fi

      # always(): озвучка упавшего ролика (например, кончилась квота посреди пакета) тоже
      # пригодится повтору. Ключ — по содержимому кэша: ничего не добавилось — не сохраняем.
      - name: Кэш озвучки — сохранить
        if: always() && env.MODE != 'draft' && hashFiles('video-studio/.cache/voice/*.json') != '' && steps.voice-cache.outputs.cache-matched-key != format('tts-voice-{0}-{1}', runner.os, hashFiles('video-studio/.cache/voice/*.json'))
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: video-studio/.cache/voice
          key: tts-voice-${{ runner.os }}-${{ hashFiles('video-studio/.cache/voice/*.json') }}

      # Сценарии (draft и пакет по плану), отметки в плане и тексты собранных роликов для
      # youtube-fill — в ветку. always(): уже готовое не теряется, даже если дальше что-то упало.
      - name: Закоммитить сценарии и тексты для YouTube
        if: always() && (env.MODE == 'draft' || env.MODE == 'batch' || env.MODE == 'render')
        env:
          FILE: ${{ steps.draft.outputs.script_path }}
          TITLE: ${{ steps.draft.outputs.title }}
          DRAFT_FORMAT: ${{ steps.draft.outputs.format }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # content/usage.jsonl — журнал расхода LLM и TTS (дописывают script и make);
          # content/long-plan.json — отметка «сценарий готов» у тем «Разбора».
          for p in scripts content/plan.json content/long-plan.json content/videos.json content/usage.jsonl; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Коммитить нечего."
            exit 0
          fi
          if [ -n "$FILE" ]; then
            msg="video-studio: черновик сценария «$TITLE»"
          else
            what=()
            git diff --cached --quiet -- scripts || what+=("сценарии")
            git diff --cached --quiet -- content/videos.json || what+=("тексты для YouTube")
            git diff --cached --quiet -- content/usage.jsonl || what+=("расход")
            msg="video-studio: ${what[0]:-план}${what[1]:+ и ${what[1]}}${PLAN:+ ($PLAN)}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Токен — только в этом шаге (checkout его не сохраняет).
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          gitauth() { git -c "http.$GITHUB_SERVER_URL/.extraheader=$auth" "$@"; }
          git commit -q -m "$msg"
          pushed=""
          for i in 1 2 3; do
            if gitauth pull --rebase --quiet origin "$GITHUB_REF_NAME" && gitauth push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=1
              break
            fi
            # Конфликт оставляет rebase незавершённым — без abort все следующие
            # попытки падали бы сразу («unmerged files»).
            git rebase --abort 2>/dev/null || true
            echo "Пуш не удался (попытка $i), повторяю…"
            sleep $((i * 5))
          done
          if [ -z "$pushed" ]; then
            echo "::error::Не удалось запушить в $GITHUB_REF_NAME (конфликт с изменениями в ветке или ветка защищена). Сценарии сохранены в артефакте запуска."
            exit 1
          fi
          if [ -n "$FILE" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/video-studio/$FILE"
            edit="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/edit/$GITHUB_REF_NAME/video-studio/$FILE"
            {
              echo ""
              echo "**Файл:** [video-studio/$FILE]($url) · [✏️ редактировать]($edit)"
              echo ""
              hint=""
              [ "$DRAFT_FORMAT" = "landscape" ] && hint=", format = **landscape**"
              echo "Следующий шаг: Actions → «video-studio: ролик» → Run workflow → mode = **render**, script = \`video-studio/$FILE\`$hint."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = "draft" ] && [ -n "$PLAN" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Следующий шаг: mode = **batch**, plan = \`$PLAN\`, upload = **release** — или кнопка «Собрать видео» в панели." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Уведомление на телефон через панель: «видео готово — загрузите в Studio». Нужны секреты
      # PANEL_URL (адрес панели) и PANEL_NOTIFY_SECRET (тот же, что в Vercel); без них шаг молчит.
      - name: Уведомить телефон
        if: success() && (env.MODE == 'batch' || env.MODE == 'render') && contains(env.UPLOAD, 'release')
        continue-on-error: true
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_NOTIFY_SECRET: ${{ secrets.PANEL_NOTIFY_SECRET }}
        run: |
          if [ -z "$PANEL_URL" ] || [ -z "$PANEL_NOTIFY_SECRET" ]; then
            echo "Уведомления не настроены (секреты PANEL_URL и PANEL_NOTIFY_SECRET) — пропускаю."
            exit 0
          fi
          # Один ролик — нажатие открывает сразу его карточку в панели (/?v=08a, /?v=L01), несколько — ленту.
          url="/"
          what="${PLAN:-новый ролик}"
          if [[ "${PLAN:-}" =~ ^([0-9]{2}[a-z]|[lL][0-9]{2})$ ]]; then url="/?v=$PLAN"; fi
          if [[ "${PLAN:-}" =~ ^[lL][0-9]{2}$ ]]; then what="«Разбор» $PLAN"; fi
          body=$(jq -n --arg b "$what — загрузите в Studio" --arg u "$url" '{title: "Видео готово", body: $b, url: $u}')
          curl -fsS --max-time 30 -X POST "${PANEL_URL%/}/api/notify" \
            -H "Authorization: Bearer $PANEL_NOTIFY_SECRET" -H "Content-Type: application/json" -d "$body" > /dev/null
          echo "Уведомление отправлено."

      # Сборка или сценарий упали — сразу на телефон, а не утренней сводкой: в «Запусках» панели
      # видно, на каком этапе, и есть «Повторить». Те же секреты; без них шаг молчит.
      - name: Уведомить телефон о сбое
        if: failure() && env.PLAN != ''
        continue-on-error: true
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_NOTIFY_SECRET: ${{ secrets.PANEL_NOTIFY_SECRET }}
        run: |
          if [ -z "$PANEL_URL" ] || [ -z "$PANEL_NOTIFY_SECRET" ]; then
            echo "Уведомления не настроены (секреты PANEL_URL и PANEL_NOTIFY_SECRET) — пропускаю."
            exit 0
          fi
          what="сборка"
          if [ "${MODE:-}" = "draft" ]; then what="сценарий"; fi
          body=$(jq -n --arg b "$PLAN — $what не удалась. Откройте «Запуски»: там этап и «Повторить»" '{title: "Сборка не удалась", body: $b, url: "/runs"}')
          curl -fsS --max-time 30 -X POST "${PANEL_URL%/}/api/notify" \
            -H "Authorization: Bearer $PANEL_NOTIFY_SECRET" -H "Content-Type: application/json" -d "$body" > /dev/null
          echo "Уведомление о сбое отправлено."

      # Без релиза пакет живёт только в артефакте — на 3 дня (квота хранилища артефактов мала).
      - name: Артефакт пакета
        if: always() && env.MODE == 'batch' && !contains(env.UPLOAD, 'release') && !contains(env.UPLOAD, 'instagram')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: batch-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
          path: |
            video-studio/out/*/video.mp4
            video-studio/out/*/thumbnail.png
            video-studio/out/*/cover.jpg
            video-studio/out/*/instagram.txt
            video-studio/out/*/description.txt
            video-studio/out/*/captions.srt

      # Сборка упала или вышло время — сохраняем хотя бы сценарий (написанный LLM
      # стоил квоты или денег), props и стоимость: run_dir известен с первого шага make.
      - name: Сценарий и стоимость (сборка не удалась)
        if: (failure() || cancelled()) && env.MODE == 'render' && steps.render.outputs.run_dir != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: failed-${{ steps.render.outputs.slug }}-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            video-studio/${{ steps.render.outputs.run_dir }}/script.json
            video-studio/${{ steps.render.outputs.run_dir }}/props.json
            video-studio/${{ steps.render.outputs.run_dir }}/cost.json
            video-studio/${{ steps.render.outputs.run_dir }}/description.txt

      - name: Сводка при ошибке
        if: failure()
        env:
          VOICE_ERROR: ${{ steps.render.outputs.voice_error }}
        run: |
          {
            echo "## ❌ Запуск не удался"
            echo ""
            # Пакет пишет причину по каждому ролику в свою таблицу, render — сюда.
            if [ -n "$VOICE_ERROR" ]; then
              echo "**Озвучка:** $VOICE_ERROR."
              echo ""
            fi
            echo "Откройте шаг с красным крестиком — в конце его лога строка «✖ Ошибка:» с причиной и подсказкой."
            echo "Частые причины: не задан секрет (GEMINI_API_KEY для темы), ошибка в JSON сценария, исчерпана квота API."
          } >> "$GITHUB_STEP_SUMMARY"
