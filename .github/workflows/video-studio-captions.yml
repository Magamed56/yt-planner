# video-studio: субтитры роликов на других языках — перевод русских captions.srt и дорожки
# «English (AI)», «Қазақша (AI)»… у роликов на YouTube.
#
# Actions → «video-studio: субтитры на других языках» → Run workflow:
#   codes = 08a,08b · langs = en,kk,uz · dry_run — сначала с галочкой: перевод и проверка без загрузки.
# Русские субтитры берутся из релиза ролика (файл «08a-….mp4» + captions.srt), переводы
# (captions.en.srt …) ложатся в тот же релиз (кроме пробного запуска) и в артефакт. Ролик ищется по
# коду, как в youtube-fill. Повторный запуск безопасен: загруженные дорожки пропускаются.
# Нужны секреты GEMINI_API_KEY (перевод, бесплатно) и YT_CLIENT_ID, YT_CLIENT_SECRET,
# YT_REFRESH_TOKEN с правом youtube.force-ssl (ключ до октября 2026 — выпустить заново:
# npm run youtube-auth). Без YT_* субтитры только переводятся. Квота YouTube: ~400 единиц за
# дорожку из 10 000 в сутки (≈ 20 дорожек в день).

name: "video-studio: субтитры на других языках"
run-name: "${{ format('captions: {0} → {1}{2}', inputs.codes, inputs.langs, inputs.dry_run && ' (проверка)' || '') }}"

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Коды роликов через запятую: 08a,08b"
        type: string
        required: true
      langs:
        description: "Языки субтитров через запятую: en,kk,uz (ещё uk, es, de, fr, pt, tr)"
        type: string
        default: en
      dry_run:
        description: "Пробный запуск: перевести и показать, но на YouTube ничего не загружать"
        type: boolean
        default: true

permissions:
  contents: write # переводы — в релиз ролика, расход LLM — коммитом

# Та же очередь, что у «video-studio: ролик»: не делим квоты бесплатных API и не толкаемся при пуше.
concurrency:
  group: video-studio
  cancel-in-progress: false
  queue: max

jobs:
  captions:
    name: Перевод субтитров
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video-studio
        shell: bash
    env:
      # Ввод пользователя — только через env, не подставляем в текст команды.
      CODES: ${{ inputs.codes }}
      LANGS: ${{ inputs.langs }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_FALLBACKS: ${{ vars.LLM_FALLBACKS }}
      LLM_EFFORT: ${{ vars.LLM_EFFORT }}
      NO_COLOR: "1"
    steps:
      - name: Код репозитория
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # Токен с правом записи не оставляем в .git/config — пушу его дают явно (см. ниже).
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-studio/package-lock.json

      - name: Зависимости (npm ci)
        run: npm ci --no-audit --no-fund

      # Без npm-кода: токен GitHub процессу с зависимостями не достаётся.
      - name: Русские субтитры из релизов
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/captions
          : > "$RUNNER_TEMP/caption-tags"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          IFS=', ' read -r -a codes <<< "$CODES"
          for c in "${codes[@]}"; do
            c="${c,,}"
            [ -z "$c" ] && continue
            if ! [[ "$c" =~ ^[0-9]{2}[a-z]$ ]]; then
              echo "::error::Код ролика — вида 08a, а не «$c»."
              exit 1
            fi
            # Самый свежий релиз русского ролика: «08a-….mp4» и captions.srt (переводы «en-08a-…» — мимо).
            tag=$(jq -r --arg re "^${c}-.+\\.mp4$" '[.[] | select(.draft | not) | select(([.assets[].name] | any(test($re; "i"))) and ([.assets[].name] | index("captions.srt")))] | sort_by(.published_at // .created_at) | reverse | .[0].tag_name // empty' "$RUNNER_TEMP/releases.json")
            if [ -z "$tag" ]; then
              echo "::warning::$c: нет релиза с файлом $c-….mp4 и captions.srt — соберите ролик с upload = release."
              continue
            fi
            gh release download "$tag" --pattern captions.srt --dir "out/captions/$c" --clobber
            echo "$c $tag" >> "$RUNNER_TEMP/caption-tags"
            echo "$c: субтитры из релиза $tag"
          done

      - name: Перевод и загрузка на YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          args=("$CODES" --langs "$LANGS" --from out/captions)
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run); fi
          if [ -z "$YT_CLIENT_ID" ] || [ -z "$YT_CLIENT_SECRET" ] || [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::notice::Секретов YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN нет — субтитры только переводятся (файлы — в релизе и артефакте), на YouTube не загружаются."
            args+=(--no-upload)
          fi
          npm run captions-translate -- "${args[@]}"

      # Пробный запуск ничего не меняет — переводы только в артефакте.
      - name: Переводы — в релиз ролика
        if: always() && env.DRY_RUN == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/caption-tags" ] || exit 0
          while read -r c tag; do
            files=(out/captions/"$c"/captions.*.srt)
            [ -e "${files[0]}" ] || continue
            gh release upload "$tag" "${files[@]}" --clobber
            echo "$c: ${#files[@]} файл(ов) перевода → релиз $tag"
          done < "$RUNNER_TEMP/caption-tags"

      - name: Переводы в артефакте
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: captions-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: video-studio/out/captions/*/captions.*.srt

      - name: Закоммитить расход LLM
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -e content/usage.jsonl ] && git add -- content/usage.jsonl
          if git diff --cached --quiet; then
            echo "Коммитить нечего."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Токен — только в этом шаге (checkout его не сохраняет).
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          gitauth() { git -c "http.$GITHUB_SERVER_URL/.extraheader=$auth" "$@"; }
          git commit -q -m "video-studio: расход (субтитры $CODES)"
          for i in 1 2 3; do
            if gitauth pull --rebase --quiet origin "$GITHUB_REF_NAME" && gitauth push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            # Конфликт оставляет rebase незавершённым — без abort следующие попытки падали бы сразу.
            git rebase --abort 2>/dev/null || true
            echo "Пуш не удался (попытка $i), повторяю…"
            sleep $((i * 5))
          done
          echo "::warning::Расход LLM не запушен (конфликт или защищённая ветка) — на субтитры это не влияет."
