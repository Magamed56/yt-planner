# video-studio: проверка ключей — ничего не публикует и не меняет.
#
# Показывает, какие секреты заданы (только имена; и ключи стоков Pexels/Pixabay — без них кадры
# только из Wikimedia), проверяет токен Instagram (срок, права, IG_USER_ID — npm run
# instagram-token) и, если есть ключи YouTube, делает пробный запуск
# youtube-fill (--dry-run): какие ролики на канале нашлись и что им будет поставлено.
# Запуск: Actions → «video-studio: проверка ключей» → Run workflow. Сам запускается и при
# изменении этого файла в ветке claude/… — так проверку можно сделать до слияния в master.

name: "video-studio: проверка ключей"

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/video-studio-check.yml"]

permissions:
  contents: read

concurrency:
  group: video-studio-check
  cancel-in-progress: true

jobs:
  check:
    name: Ключи YouTube и Instagram
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video-studio
        shell: bash
    env:
      NO_COLOR: "1"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Стоки для кадров по теме (docs/visuals.md) — без них только Wikimedia/Openverse.
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - name: Код репозитория
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Какие секреты заданы (только имена)
        # Ключи стоков и второй ключ Gemini нужны только здесь (есть/нет), дальше по шагам их не передаём.
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          {
            echo "### 🔑 Секреты video-studio"
            echo ""
            for k in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN IG_USER_ID IG_ACCESS_TOKEN GEMINI_API_KEY GEMINI_API_KEY_2 ANTHROPIC_API_KEY PEXELS_API_KEY PIXABAY_API_KEY; do
              if [ -n "${!k}" ]; then echo "- \`$k\` — есть"; else echo "- \`$k\` — нет"; fi
            done
            if [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ]; then
              echo ""
              echo "> Нет ни PEXELS_API_KEY, ни PIXABAY_API_KEY: стокового видео не будет, кадры только из Wikimedia и часто мимо темы. Заведите бесплатные ключи (https://www.pexels.com/api/, https://pixabay.com/api/docs/) и добавьте их в Settings → Secrets and variables → Actions."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Ключ стоков — пробным поиском фото и видео (по 3 результата); сам ключ в лог не попадает.
      - name: Pixabay — ключ работает?
        if: env.PIXABAY_API_KEY != ''
        continue-on-error: true
        run: |
          check() {
            local code body
            body=$(curl -sS --max-time 20 -w '\n%{http_code}' "https://pixabay.com/api/$1?key=${PIXABAY_API_KEY}&q=ocean&per_page=3&safesearch=true") || { echo "- Pixabay $2: нет связи" | tee -a "$GITHUB_STEP_SUMMARY"; return 1; }
            code=${body##*$'\n'}
            body=${body%$'\n'*}
            if [ "$code" = "200" ]; then
              hits=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("totalHits", 0))')
              echo "- Pixabay $2: ✅ ключ работает (по запросу «ocean» найдено $hits)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- Pixabay $2: ❌ HTTP $code — $(printf '%s' "$body" | head -c 200)" | tee -a "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }
          echo "" >> "$GITHUB_STEP_SUMMARY"
          check "" "фото" && check "videos/" "видео"

      - name: Node.js 22
        if: env.IG_ACCESS_TOKEN != '' || env.YT_REFRESH_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-studio/package-lock.json

      - name: Зависимости (npm ci)
        if: env.IG_ACCESS_TOKEN != '' || env.YT_REFRESH_TOKEN != ''
        run: npm ci --no-audit --no-fund

      - name: Instagram — токен, срок, права, аккаунт
        if: env.IG_ACCESS_TOKEN != ''
        continue-on-error: true
        run: npx tsx src/cli/instagram-token.ts

      - name: YouTube — пробный youtube-fill (без изменений)
        if: env.YT_REFRESH_TOKEN != ''
        continue-on-error: true
        run: npx tsx src/cli/youtube-fill.ts --dry-run
