# Временный: открытые данные похожих каналов для разбора (только чтение). Удалить после разбора.
name: "tmp: similar channels probe"
on:
  push:
    branches: [claude/stats-probe]
    paths: [tmp-probe/channels.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: python3 tmp-probe/probe.py
      - name: Обложки — в ветку (только эта временная ветка)
        run: |
          [ -d tmp-probe/thumbs ] || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-probe/thumbs && git commit -qm "tmp: обложки похожих каналов" && git push -q origin HEAD:claude/stats-probe || true
