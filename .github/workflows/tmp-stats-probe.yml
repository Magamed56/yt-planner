# Временный: выгрузка истории статистики панели и публичной ленты канала для разбора просмотров.
# Только чтение. Удаляется сразу после запуска.
name: "tmp: stats probe"
on:
  push:
    branches: [claude/stats-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: История панели и конкуренты
        env:
          H: ${{ vars.PANEL_STATS_HISTORY }}
          C: ${{ vars.PANEL_COMPETITORS }}
        run: |
          echo "HISTORY_BEGIN"; printf '%s\n' "$H"; echo "HISTORY_END"
          echo "COMP_BEGIN"; printf '%s\n' "$C"; echo "COMP_END"
      - name: Названия роликов (oEmbed)
        run: |
          for id in zXIEtaqBmnY wYQ68wsoNuA lKJtM788uaE JKwX3NHM5Uw gbrWoDJ4Ux0 KIfOfMRkZT4; do
            t=$(curl -s --max-time 20 "https://www.youtube.com/oembed?url=https://www.youtube.com/shorts/$id&format=json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("title"))' 2>/dev/null)
            echo "TITLE $id $t"
          done
