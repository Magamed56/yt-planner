# video-studio: сравнение подачи — один ролик (18b) в нескольких вариантах, ничего не публикует.
#
# B — подача «bright» на стоках, C — ИИ-картинки «почти фото», D — ИИ-картинки «3D-мульт»
# (examples/look-jeans-*.json): голос, картинки и props.json без рендера — рендер со стрелками
# делается локально. Контроль A (как сейчас) — обычный рендер scripts/sut-18b-….json.
# Текст у всех один, поэтому озвучка — одна (общий кэш), меняется только картинка.
# Каждый вариант — на своём раннере (свой IP: у Pollinations лимит 1 картинка в 45 с на IP),
# результат — в ветке claude/look-test-out-<вариант> (перезаписывается).
# Ни релизов, ни YouTube, ни очередей. Запускается сам при изменении этого файла или
# сценариев вариантов в ветке claude/….

name: "video-studio: сравнение подачи"

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/video-studio-look-test.yml"
      - "video-studio/examples/look-*.json"

permissions:
  contents: write # пуш результата в claude/look-test-out-*

concurrency:
  group: video-studio-look-test
  cancel-in-progress: true

jobs:
  look:
    name: Вариант ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [b, c, d]
    defaults:
      run:
        working-directory: video-studio
        shell: bash
    env:
      NO_COLOR: "1"
      VARIANT: ${{ matrix.variant }}
      # Голос — как у основного workflow: тот же ключ кэша озвучки, квота Gemini не тратится повторно.
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'auto' }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      TTS_RATE: ${{ vars.TTS_RATE }}
      TTS_FALLBACK: ${{ vars.TTS_FALLBACK }}
      TTS_CACHE_DIR: ${{ github.workspace }}/video-studio/.cache/voice
      TTS_CACHE: ${{ vars.TTS_CACHE }}
      TTS_CACHE_DAYS: ${{ vars.TTS_CACHE_DAYS }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
      GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}
      MODELS_DIR: ${{ github.workspace }}/video-studio/models
      CAPTION_ALIGN: ${{ vars.CAPTION_ALIGN }}
      MUSIC: ${{ vars.MUSIC }}
      MUSIC_MOOD: ${{ vars.MUSIC_MOOD }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      VISUALS_PREFER: ${{ vars.VISUALS_PREFER }}
      VISUALS_JUDGE: ${{ vars.VISUALS_JUDGE || 'claude' }}
      VISUALS_JUDGE_MODEL: ${{ vars.VISUALS_JUDGE_MODEL }}
      VISUALS_MIN_PHOTO_PX: ${{ vars.VISUALS_MIN_PHOTO_PX }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Код репозитория
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-studio/package-lock.json

      - name: Зависимости (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Модель распознавания — имя
        id: asr-model
        run: |
          name=$(npx tsx -e 'import("./src/pipeline/voice/align.ts").then((m) => console.log(m.ASR_MODEL_NAME))' | tail -n 1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Кэш модели распознавания — восстановить
        if: steps.asr-model.outputs.name != ''
        uses: actions/cache/restore@v6
        with:
          path: video-studio/models/${{ steps.asr-model.outputs.name }}
          key: asr-model-${{ runner.os }}-${{ steps.asr-model.outputs.name }}

      - name: Кэш озвучки — восстановить
        uses: actions/cache/restore@v6
        with:
          path: video-studio/.cache/voice
          key: tts-voice-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tts-voice-${{ runner.os }}-

      # Картинки прошлого запуска этого варианта: make берёт их повторно (manifest.json),
      # заново генерируются только сцены, где картинки нет (сбой или лимит Pollinations).
      - name: Прошлый результат варианта
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/look
          if git fetch -q --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "claude/look-test-out-$VARIANT" 2>/dev/null; then
            # Путь в archive — от корня репозитория, а шаг идёт в video-studio/.
            (cd .. && git archive FETCH_HEAD "$VARIANT") | tar -x -C out/look
            echo "взял прошлые картинки: $(ls out/look/$VARIANT/*/public/visuals 2>/dev/null | tr '\n' ' ')"
          else
            echo "прошлого результата нет"
          fi

      - name: Голос, картинки и props.json (без рендера)
        env:
          POLLINATIONS_WAIT_MAX_SEC: "240"
          VISUALS_GEN_TIMEOUT_MS: "150000"
        run: |
          mkdir -p out/look
          file="examples/look-jeans-$VARIANT.json"
          # Свой порядок источников и стиль ИИ-картинок — из сценария варианта (если заданы).
          v="$(node -p "require('./$file').visuals || ''")"; [ -n "$v" ] && export VISUALS="$v"
          s="$(node -p "require('./$file').visualStyle || ''")"; [ -n "$s" ] && export VISUALS_STYLE="$s"
          npm run make -- --script "$file" --out "out/look/$VARIANT" --no-render 2>&1 | tee "out/look/$VARIANT.log"

      - name: Пуш в claude/look-test-out-${{ matrix.variant }}
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_BRANCH: claude/look-test-out-${{ matrix.variant }}
          STAGE: "${{ matrix.variant }} — голос и картинки"
        run: bash ../.github/scripts/look-test-push.sh
